; PlatformIO project for the ALEX RCVR/TX filter board standalone controller
; Board: generic ESP32-WROOM-32 dev board
; See README.md for wiring and usage.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
; Uncomment and set if auto-detection picks the wrong port:
; upload_port = COM5
; monitor_port = COM5
